<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Типы локальных сетей · 7 класс</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1b3a5c 0%, #0a1628 60%, #050b14 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: #2a7faa;
            top: -180px;
            left: -150px;
            animation: float1 18s ease-in-out infinite;
        }

        body::after {
            width: 420px;
            height: 420px;
            background: #7f5af0;
            bottom: -160px;
            right: -120px;
            animation: float2 22s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 50px) scale(1.15); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, -60px) scale(1.1); }
        }

        .presentation-container {
            position: relative;
            z-index: 2;
            max-width: 1240px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px;
            padding: 28px 28px 34px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.75),
                        0 0 0 1px rgba(255, 255, 255, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
            animation: containerIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-wrapper {
            background: linear-gradient(150deg, #f5faff 0%, #e6f0fb 55%, #dde9f7 100%);
            border-radius: 44px;
            padding: 28px 32px 20px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.9),
                        inset 0 -6px 20px rgba(21, 56, 90, 0.08),
                        0 24px 40px -12px rgba(0, 0, 0, 0.5);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .slide-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2a7faa, #7f5af0, #2a7faa);
            background-size: 200% 100%;
            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .slide-content {
            flex: 1;
            padding: 14px 10px 18px;
        }

        .slide-content h1 {
            font-size: 3.0rem;
            font-weight: 800;
            color: #0b2b44;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            padding-left: 26px;
            position: relative;
            animation: titleIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .slide-content h1::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8%;
            height: 84%;
            width: 8px;
            border-radius: 8px;
            background: linear-gradient(180deg, #2a7faa, #7f5af0);
            box-shadow: 0 0 12px rgba(42, 127, 170, 0.6);
        }

        @keyframes titleIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-content h2 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #113a55;
            margin-top: 6px;
            margin-bottom: 16px;
            animation: fadeUp 0.55s 0.06s both;
        }

        .slide-content h3 {
            font-size: 2.0rem;
            font-weight: 600;
            color: #1f4b6b;
            margin: 14px 0 8px;
        }

        .slide-content p,
        .slide-content li {
            font-size: 1.8rem;
            line-height: 1.5;
            color: #1d3a4e;
            margin-bottom: 12px;
            animation: fadeUp 0.55s 0.12s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-content ul {
            list-style: none;
            padding-left: 10px;
        }

        .slide-content ul li {
            padding: 5px 0 5px 40px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="%232a7faa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>') left center no-repeat;
            background-size: 26px;
            margin-bottom: 4px;
        }

        .slide-content ul li:nth-child(1) { animation-delay: 0.14s; }
        .slide-content ul li:nth-child(2) { animation-delay: 0.20s; }
        .slide-content ul li:nth-child(3) { animation-delay: 0.26s; }
        .slide-content ul li:nth-child(4) { animation-delay: 0.32s; }
        .slide-content ul li:nth-child(5) { animation-delay: 0.38s; }
        .slide-content ul li:nth-child(6) { animation-delay: 0.44s; }
        .slide-content ul li:nth-child(7) { animation-delay: 0.50s; }
        .slide-content ul li:nth-child(8) { animation-delay: 0.56s; }

        .slide-content .highlight {
            background: linear-gradient(135deg, #d4e7f7, #c3ddf2);
            padding: 2px 16px;
            border-radius: 60px;
            display: inline-block;
            font-weight: 700;
            color: #003153;
            font-size: 2.0rem;
            box-shadow: inset 0 1px 0 #ffffff, 0 2px 6px rgba(42, 127, 170, 0.2);
        }

        .slide-content .example-block {
            background: linear-gradient(135deg, rgba(42, 127, 170, 0.10), rgba(127, 90, 240, 0.07));
            border-radius: 30px;
            padding: 16px 26px;
            margin: 14px 0 8px;
            border: 1px solid rgba(42, 127, 170, 0.22);
            border-left: 6px solid #2a7faa;
            animation: fadeUp 0.6s 0.2s both;
            box-shadow: 0 6px 18px -8px rgba(42, 127, 170, 0.3);
        }

        .slide-content .example-block p {
            font-size: 1.8rem;
            margin: 4px 0;
        }

        .slide-content .task-solution {
            background: linear-gradient(135deg, #dcebf8, #cfe3f4);
            border-radius: 28px;
            padding: 16px 26px;
            margin-top: 12px;
            border-left: 6px solid #7f5af0;
            animation: fadeUp 0.6s 0.24s both;
            box-shadow: 0 6px 18px -8px rgba(127, 90, 240, 0.35);
        }

        .slide-content .task-solution strong {
            font-size: 1.8rem;
            color: #003459;
        }

        .slide-content .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 14px 0;
        }

        .slide-content .two-col .col {
            background: linear-gradient(135deg, rgba(42, 127, 170, 0.08), rgba(127, 90, 240, 0.06));
            border-radius: 22px;
            padding: 16px 20px;
            border: 1px solid rgba(42, 127, 170, 0.18);
            animation: fadeUp 0.6s both;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .slide-content .two-col .col:nth-child(1) { animation-delay: 0.14s; }
        .slide-content .two-col .col:nth-child(2) { animation-delay: 0.24s; }

        .slide-content .two-col .col:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(42, 127, 170, 0.5);
        }

        .slide-content .two-col .col h3 {
            font-size: 2.0rem;
            color: #1f4b6b;
            margin-bottom: 8px;
        }

        .slide-content .two-col .col p,
        .slide-content .two-col .col li {
            font-size: 1.6rem;
        }

        .slide-content .formula {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #1f6390, #7f5af0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            padding: 12px 0;
            animation: glowPulse 2.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(42, 127, 170, 0.3)); }
            50% { filter: drop-shadow(0 0 14px rgba(127, 90, 240, 0.6)); }
        }

        .slide-content .final-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin: 14px 0;
        }

        .slide-content .final-grid .card {
            background: linear-gradient(135deg, #ffffff, #e8f1fa);
            border-radius: 22px;
            padding: 16px 18px;
            text-align: center;
            border: 1px solid rgba(42, 127, 170, 0.18);
            box-shadow: 0 8px 20px -12px rgba(21, 56, 90, 0.4);
            animation: popIn 0.55s both;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .slide-content .final-grid .card:nth-child(1) { animation-delay: 0.10s; }
        .slide-content .final-grid .card:nth-child(2) { animation-delay: 0.18s; }
        .slide-content .final-grid .card:nth-child(3) { animation-delay: 0.26s; }
        .slide-content .final-grid .card:nth-child(4) { animation-delay: 0.34s; }
        .slide-content .final-grid .card:nth-child(5) { animation-delay: 0.42s; }
        .slide-content .final-grid .card:nth-child(6) { animation-delay: 0.50s; }

        .slide-content .final-grid .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 16px 30px -14px rgba(42, 127, 170, 0.6);
        }

        .slide-content .final-grid .card .icon {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 6px;
        }

        .slide-content .final-grid .card .label {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0b2b44;
        }

        .slide-content .device-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 14px 0;
        }

        .slide-content .device-compare .device {
            background: linear-gradient(135deg, #ffffff, #e8f1fa);
            border-radius: 22px;
            padding: 18px 20px;
            border: 1px solid rgba(42, 127, 170, 0.2);
            box-shadow: 0 8px 20px -12px rgba(21, 56, 90, 0.35);
            animation: popIn 0.55s both;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .slide-content .device-compare .device:nth-child(1) { animation-delay: 0.12s; }
        .slide-content .device-compare .device:nth-child(2) { animation-delay: 0.24s; }

        .slide-content .device-compare .device:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px -14px rgba(42, 127, 170, 0.55);
        }

        .slide-content .device-compare .device .dev-title {
            font-size: 2.0rem;
            font-weight: 700;
            color: #1f6390;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slide-content .device-compare .device p {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        /* ===== СЛАЙД С ЗАДАЧАМИ И СКРЫТЫМИ РЕШЕНИЯМИ ===== */
        .slide-content .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .slide-content .task-card {
            background: linear-gradient(135deg, #ffffff, #eef5fc);
            border-radius: 20px;
            padding: 14px 20px;
            border: 1px solid rgba(42, 127, 170, 0.22);
            border-left: 5px solid #2a7faa;
            box-shadow: 0 6px 16px -10px rgba(21, 56, 90, 0.4);
            animation: fadeUp 0.5s both;
        }

        .slide-content .task-card:nth-child(1) { animation-delay: 0.05s; }
        .slide-content .task-card:nth-child(2) { animation-delay: 0.12s; }
        .slide-content .task-card:nth-child(3) { animation-delay: 0.19s; }
        .slide-content .task-card:nth-child(4) { animation-delay: 0.26s; }

        .slide-content .task-card .task-question {
            font-size: 1.75rem;
            font-weight: 600;
            color: #0b2b44;
            margin: 0 0 6px;
        }

        .slide-content .task-card .task-question .num {
            display: inline-block;
            background: linear-gradient(135deg, #2a7faa, #7f5af0);
            color: #fff;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 700;
            margin-right: 10px;
        }

        /* скрытое решение */
        .slide-content .task-card .solution {
            display: none;
            margin-top: 10px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #dcebf8, #cfe3f4);
            border-radius: 16px;
            border-left: 5px solid #7f5af0;
            font-size: 1.65rem;
            color: #003459;
            animation: fadeUp 0.35s both;
        }

        .slide-content .task-card .solution.show {
            display: block;
        }

        .slide-content .task-card .solution p {
            font-size: 1.65rem;
            margin: 3px 0;
        }

        .slide-content .task-card .solution .answer {
            font-weight: 800;
            color: #7f5af0;
            font-size: 1.8rem;
            margin-top: 6px;
            display: inline-block;
            background: #fff;
            padding: 2px 14px;
            border-radius: 40px;
            box-shadow: 0 2px 8px rgba(127, 90, 240, 0.25);
        }

        /* Кнопка показать/скрыть */
        .slide-content .toggle-solutions-btn {
            align-self: flex-start;
            margin: 16px 0 6px;
            padding: 12px 34px;
            font-size: 1.9rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #2a7faa, #7f5af0);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 22px -8px rgba(42, 127, 170, 0.7);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeUp 0.5s 0.3s both;
        }

        .slide-content .toggle-solutions-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -10px rgba(127, 90, 240, 0.8);
            filter: brightness(1.08);
        }

        .slide-content .toggle-solutions-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px -4px rgba(42, 127, 170, 0.7);
        }

        .slide-content .toggle-solutions-btn i {
            font-size: 2rem;
        }

        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 16px;
        }

        .nav-btn {
            border: none;
            width: 66px;
            height: 66px;
            border-radius: 40px;
            font-size: 2.2rem;
            color: #1a4663;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #ffffff, #e6f0fa);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 0 #b0c9dd, 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .nav-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b0c9dd, 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            background: #ffffff;
            color: #003153;
            box-shadow: 0 8px 0 #9bb3cc, 0 10px 24px rgba(0, 0, 0, 0.3);
        }

        .nav-btn i {
            font-size: 2.6rem;
        }

        .page-indicator {
            font-size: 2.0rem;
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(6px);
            padding: 6px 30px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        .fade-slide {
            animation: fadeSlide 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeSlide {
            0% { opacity: 0.25; transform: translateY(22px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .fullscreen-btn {
            border: none;
            width: 54px;
            height: 54px;
            border-radius: 40px;
            font-size: 2.0rem;
            color: #1a4663;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #ffffff, #e6f0fa);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 0 #b0c9dd, 0 6px 16px rgba(0, 0, 0, 0.2);
            margin-left: 10px;
        }

        .fullscreen-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b0c9dd, 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .fullscreen-btn:hover {
            background: #ffffff;
            color: #003153;
            box-shadow: 0 6px 0 #9bb3cc, 0 8px 20px rgba(0, 0, 0, 0.28);
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 820px) {
            .presentation-container { padding: 18px; }
            .slide-wrapper { padding: 22px 20px 16px; }
            .slide-content h1 { font-size: 2.2rem; padding-left: 18px; }
            .slide-content h2 { font-size: 1.8rem; }
            .slide-content p,
            .slide-content li,
            .slide-content .example-block p { font-size: 1.5rem; }
            .slide-content .highlight { font-size: 1.6rem; }
            .nav-btn { width: 56px; height: 56px; font-size: 1.8rem; }
            .page-indicator { font-size: 1.5rem; padding: 4px 18px; }
            .fullscreen-btn { width: 46px; height: 46px; font-size: 1.6rem; }
            .slide-content .two-col,
            .slide-content .device-compare { grid-template-columns: 1fr; }
            .slide-content .formula { font-size: 1.9rem; }
            .slide-content .final-grid .card .label { font-size: 1.4rem; }
            .slide-content .task-card .task-question { font-size: 1.5rem; }
            .slide-content .task-card .solution,
            .slide-content .task-card .solution p { font-size: 1.4rem; }
            .slide-content .toggle-solutions-btn { font-size: 1.6rem; padding: 10px 24px; }
        }

        @media (max-width: 520px) {
            .slide-content h1 { font-size: 1.8rem; }
            .slide-content h2 { font-size: 1.6rem; }
            .slide-content p,
            .slide-content li { font-size: 1.3rem; }
            .navigation-bar { gap: 6px; flex-wrap: wrap; }
            .nav-group { gap: 6px; }
            .slide-content .final-grid { grid-template-columns: 1fr 1fr; }
            .slide-content .task-card { padding: 10px 14px; }
            .slide-content .task-card .task-question { font-size: 1.3rem; }
            .slide-content .task-card .solution,
            .slide-content .task-card .solution p { font-size: 1.2rem; }
        }

        .presentation-container.fullscreen {
            max-width: 100%;
            border-radius: 0;
            padding: 14px 18px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .presentation-container.fullscreen .slide-wrapper {
            min-height: 74vh;
        }
    </style>
</head>
<body>
<div class="presentation-container" id="presentationContainer">
    <div class="slide-wrapper">
        <div id="slideContent" class="slide-content fade-slide"></div>

        <div class="navigation-bar">
            <div class="nav-group">
                <button class="nav-btn" id="prevSlide" aria-label="Предыдущий"><i class="fas fa-chevron-left"></i></button>
                <button class="nav-btn" id="nextSlide" aria-label="Следующий"><i class="fas fa-chevron-right"></i></button>
            </div>
            <span class="page-indicator" id="pageIndicator">1 / 17</span>
            <div class="nav-group">
                <button class="fullscreen-btn" id="fullscreenBtn" aria-label="На весь экран"><i class="fas fa-expand"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---- СЛАЙДЫ ПО ТЕМЕ "ТИПЫ ЛОКАЛЬНЫХ СЕТЕЙ" ----
        const slides = [
            // 1. Титульный + ключевые слова
            {
                title: '🌐 Типы локальных сетей',
                content: `
                    <h2>Ключевые слова</h2>
                    <ul>
                        <li>локальная сеть</li>
                        <li>одноранговая сеть</li>
                        <li>сеть с выделенным сервером</li>
                        <li>беспроводная сеть</li>
                        <li>Bluetooth, Wi-Fi</li>
                        <li>точка доступа</li>
                        <li>сетевая карта, роутер</li>
                        <li>патч-корд, маршрутизатор</li>
                    </ul>
                    <div class="example-block">
                        <p>📌 <strong>Локальная сеть</strong> — компьютерная сеть в одном или нескольких соседних зданиях.</p>
                    </div>
                `
            },
            // 2. Одноранговые сети
            {
                title: '🤝 Одноранговые сети',
                content: `

        // ---- СОСТОЯНИЕ ----
        let currentSlide = 0;
        const slideContent = document.getElementById('slideContent');
        const pageIndicator = document.getElementById('pageIndicator');
        const container = document.getElementById('presentationContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // ---- ОТОБРАЖЕНИЕ ----
        function renderSlide(index) {
            const slide = slides[index];
            if (!slide) return;

            slideContent.innerHTML = `
                <h1>${slide.title}</h1>
                ${slide.content}
            `;
            pageIndicator.textContent = `${index + 1} / ${slides.length}`;

            slideContent.classList.remove('fade-slide');
            void slideContent.offsetWidth; 
            slideContent.classList.add('fade-slide');

            // Если это слайд с задачами — навешиваем обработчик на кнопку
            const toggleBtn = document.getElementById('toggleSolutionsBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const solutions = document.querySelectorAll('#tasksContainer .solution');
                    const anyHidden = Array.from(solutions).some(s => !s.classList.contains('show'));
                    solutions.forEach(s => {
                        if (anyHidden) {
                            s.classList.add('show');
                        } else {
                            s.classList.remove('show');
                        }
                    });
                    // Меняем текст и иконку кнопки
                    if (anyHidden) {
                        this.innerHTML = '<i class="fas fa-eye-slash"></i> Скрыть решения';
                    } else {
                        this.innerHTML = '<i class="fas fa-eye"></i> Показать решения';
                    }
                });
            }
        }

        // ---- НАВИГАЦИЯ ----
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            renderSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            renderSlide(currentSlide);
        }

        // ---- FULLSCREEN ----
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || 
                document.documentElement.webkitRequestFullscreen?.();
                container.classList.add('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                document.exitFullscreen?.() || 
                document.webkitExitFullscreen?.();
                container.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                container.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                container.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        });

        // ---- СОБЫТИЯ ----
        document.getElementById('nextSlide').addEventListener('click', nextSlide);
        document.getElementById('prevSlide').addEventListener('click', prevSlide);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        renderSlide(0);
    })();
</script>
